global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: tor
    metrics_path: /metrics
    static_configs:
      - targets:
          - tor:9100

  - job_name: tor-bridge
    static_configs:
      - targets:
          - tor-bridge-exporter:9320

  - job_name: squid
    static_configs:
      - targets:
          - squid-exporter:9301

  - job_name: squid-domains
    static_configs:
      - targets:
          - squid-domain-exporter:9330

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
