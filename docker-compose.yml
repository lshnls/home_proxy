services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        ALL_PROXY: socks5://192.168.1.10:9050
        HTTP_PROXY: socks5://192.168.1.10:9050
        HTTPS_PROXY: socks5://192.168.1.10:9050
        NO_PROXY: localhost,127.0.0.1,::1,172.26.0.0/16
    container_name: home_proxy-nginx
    restart: unless-stopped
    networks:
      - shared-net
      - monitoring
    ports:
      - "80:80"
      - "443:443"

    environment:
      ALL_PROXY: socks5://192.168.1.10:9050
      HTTP_PROXY: socks5://192.168.1.10:9050
      HTTPS_PROXY: socks5://192.168.1.10:9050
      NO_PROXY: localhost,127.0.0.1,::1,172.26.0.0/16
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf:/etc/nginx/conf:ro
      - ./nginx/certs:/etc/nginx/certs

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: home_proxy-nginx-exporter
    restart: unless-stopped
    networks:
      - monitoring
    command:
      - -nginx.scrape-uri=http://nginx:8080/stub_status

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: home_proxy-prometheus
    restart: unless-stopped
    networks:
      - monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  tor-bridge-exporter:
    build:
      context: ./tor-exporter
      dockerfile: Dockerfile
    container_name: home_proxy-tor-bridge-exporter
    restart: unless-stopped
    networks:
      - monitoring
    environment:
      TOR_CONTROL_HOST: tor
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASS: bridge_mon

  squid-exporter:
    image: boynux/squid-exporter:latest
    container_name: home_proxy-squid-exporter
    restart: unless-stopped
    networks:
      - monitoring
    command:
      - -squid-hostname=172.27.0.1
      - -squid-port=3128

  grafana:
    image: grafana/grafana:11.3.0
    container_name: home_proxy-grafana
    restart: unless-stopped
    networks:
      - monitoring
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/config/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/config/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana

  iptables-init:
    image: alpine:latest
    container_name: home_proxy-iptables-init
    privileged: true
    network_mode: host # Доступ к сети хоста для управления iptables
    volumes:
      - ./apply-iptables.sh:/apply-iptables.sh:ro
    command: ["sh", "-c", "apk add --no-cache iptables bash && bash /apply-iptables.sh apply"]
    restart: "no" # Автозапуск при старте системы

  unbound:
    build:
      context: ./unbound
      dockerfile: Dockerfile
    container_name: home_proxy-unbound
    restart: unless-stopped
    ports:
      - "$UNBOUND_PORT:53/tcp"
      - "$UNBOUND_PORT:53/udp"
    volumes:
      - ./unbound/config/unbound.conf:/etc/unbound/unbound.conf
      - unbound_certs:/etc/unbound
    networks:
      - monitoring
    command: unbound -d -c /etc/unbound/unbound.conf

  unbound-exporter:
    build:
      context: ./unbound-exporter
      dockerfile: Dockerfile
    container_name: home_proxy-unbound-exporter
    restart: unless-stopped
    depends_on:
      - unbound
    networks:
      - monitoring
    volumes:
      - unbound_certs:/etc/unbound:ro
      - ./unbound/config/unbound.conf:/etc/unbound/unbound.conf:ro
    environment:
      UNBOUND_HOST: unbound
      UNBOUND_PORT: "8953"
      UNBOUND_CONF: /etc/unbound/unbound.conf
      LISTEN_PORT: "9167"

  tor:
    build:
      context: ./tor
      dockerfile: Dockerfile
    container_name: home_proxy-tor
    restart: unless-stopped
    ports:
      - $TOR_SOCKS_PORT:9050/tcp
#    networks:
#      - $DOCKER_NETWORK
    networks:
      - monitoring
    volumes:
      - ./tor/config/torrc:/etc/tor/torrc
      - ./tor/config/bridges.txt:/etc/tor/bridges.txt
      - ./tor/data:/var/lib/tor
    environment:
      - PROJECT_GID=${PROJECT_GID:-1000}
      - HOST_GROUP_NAME=${HOST_GROUP_NAME:-project}


  privoxy:
    build:
      context: ./privoxy
      dockerfile: Dockerfile
    container_name: home_proxy-privoxy
    restart: unless-stopped
    ports:
      - "$PRIVOXY_PORT:8118"
    volumes:
      - ./privoxy/config/config:/etc/privoxy/config
      - ./privoxy/config/user.action:/etc/privoxy/user.action
    networks:
      - monitoring

  squid:
    build:
      context: ./squid
      dockerfile: Dockerfile
    container_name: home_proxy-squid
    volumes:
      - ./squid/config/squid.conf:/etc/squid/squid.conf
      - ./squid/config/tor.list:/etc/squid/tor.list
      - ./squid/config/telegram_nets.list:/etc/squid/telegram_nets.list
      - ./squid/ssl:/etc/squid/ssl
      - squid_cache:/var/spool/squid
      - ./squid/log:/var/log/squid
    network_mode: host
    restart: unless-stopped

  squid-domain-exporter:
    build:
      context: ./squid-domain-exporter
      dockerfile: Dockerfile
    container_name: home_proxy-squid-domain-exporter
    restart: unless-stopped
    networks:
      - monitoring
    volumes:
      - ./squid/log:/var/log/squid:ro
    environment:
      SQUID_ACCESS_LOG: /var/log/squid/access.log

#networks:
#  proxy_network:
#    driver: bridge

networks:
  shared-net:
    external: true
  monitoring:
    driver: bridge

volumes:
  squid_cache:
  prometheus_data:
  grafana_data:
  unbound_certs:
