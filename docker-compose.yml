services:
  iptables-init:
    image: alpine:latest
    container_name: home_proxy-iptables-init
    network_mode: host # Доступ к сети хоста для управления iptables
    cap_add:
      - NET_ADMIN # Права на управление сетью
    volumes:
      - ./apply-iptables.sh:/apply-iptables.sh:ro
      - /etc/os-release:/etc/os-release:ro # Опционально, если скрипту нужно знать ОС
    command: >
      sh -c "apk add --no-cache iptables ip6tables && 
             chmod +x /apply-iptables.sh && 
             /apply-iptables.sh && 
             echo 'IPTABLES_APPLIED_OK'"
    restart: "no" # Запускается один раз при старте

  unbound:
    build:
      context: ./unbound
      dockerfile: Dockerfile
    container_name: home_proxy-unbound
    restart: unless-stopped
    ports:
      - "$UNBOUND_PORT:53/tcp"
      - "$UNBOUND_PORT:53/udp"
    volumes:
      - ./unbound/config/unbound.conf:/etc/unbound/unbound.conf
#    networks:
#      - $DOCKER_NETWORK
    command: unbound -d -c /etc/unbound/unbound.conf

  tor:
    build:
      context: ./tor
      dockerfile: Dockerfile
    container_name: home_proxy-tor
    restart: unless-stopped
    ports:
      - $TOR_SOCKS_PORT:9050/tcp
#    networks:
#      - $DOCKER_NETWORK
    volumes:
      - ./tor/config/torrc:/etc/tor/torrc
      - ./tor/config/bridges.txt:/etc/tor/bridges.txt
      - ./tor/data:/var/lib/tor
    environment:
      - PROJECT_GID=${PROJECT_GID:-1000}
      - HOST_GROUP_NAME=${HOST_GROUP_NAME:-project}


  privoxy:
    build:
      context: ./privoxy
      dockerfile: Dockerfile
    container_name: home_proxy-privoxy
    restart: unless-stopped
    ports:
      - "$PRIVOXY_PORT:8118"
    volumes:
      - ./privoxy/config/config:/etc/privoxy/config
      - ./privoxy/config/match-all.action:/etc/privoxy/match-all.action
      - ./privoxy/config/user.action:/etc/privoxy/user.action
      - ./privoxy/config/default.action:/etc/privoxy/default.action

#    networks:
#      - $DOCKER_NETWORK

  squid:
    build:
      context: ./squid
      dockerfile: Dockerfile
    container_name: home_proxy-squid
#    ports:
#      - "$SQUID_PORT:3128"
#      - "$SQUID_HTTP_PORT:8081"
#      - "$SQUID_HTTPS_PORT:8082"
    volumes:
      - ./squid/config/squid.conf:/etc/squid/squid.conf
      - ./squid/config/tor.list:/etc/squid/tor.list
      - ./squid/ssl:/etc/squid/ssl
    network_mode: host
#    networks:
#      - $DOCKER_NETWORK
    restart: always
    stop_grace_period: 30s

#networks:
